<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — MUSO 2026 Election Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner glass-strong">
    <div class="brand">
      <div class="brand-mark">MU</div>
      <div class="brand-text"><strong>MUSO 2026</strong><span>General Election</span></div>
    </div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="candidates.html">Candidates</a></li>
      <li><a href="vote.html">Vote</a></li>
      <li><a href="results.html">Results</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn btn-ghost btn-sm" data-logout="student">Log out</button>
      <button class="icon-btn nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<main class="page-body">
  <div class="wrap" style="max-width:680px;">
    <div class="eyebrow">Account settings</div>
    <h1 style="font-size:28px; margin-bottom:26px;">My profile</h1>

    <form id="profile-form" class="glass card" style="margin-bottom:24px;">
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
        <div class="candidate-avatar" id="avatar" style="width:64px; height:64px; font-size:20px;"></div>
        <div>
          <div style="font-weight:700;" id="reg-display"></div>
          <div class="tag-mono" style="font-size:12px;">Registration number cannot be changed</div>
        </div>
      </div>

      <div class="field-row">
        <div class="field"><label for="fullName">Full name</label><input type="text" id="fullName" required></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="phone">Phone number</label><input type="tel" id="phone" required></div>
        <div class="field"><label for="gender">Gender</label>
          <select id="gender"><option>Female</option><option>Male</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label for="faculty">Faculty / School</label><input type="text" id="faculty" required></div>
        <div class="field"><label for="department">Department</label><input type="text" id="department" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="course">Course / Programme</label><input type="text" id="course" required></div>
        <div class="field"><label for="year">Year of study</label>
          <select id="year"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </form>

    <form id="password-form" class="glass card">
      <div class="eyebrow">Change password</div>
      <div class="field"><label for="current-pw">Current password</label><input type="password" id="current-pw" required></div>
      <div class="field"><label for="new-pw">New password</label><input type="password" id="new-pw" minlength="6" required></div>
      <div class="field-error" id="pw-error" style="margin-bottom:14px;">Current password is incorrect.</div>
      <button type="submit" class="btn btn-outline">Update password</button>
    </form>
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const session = requireAuth('student');
  if (session){
    const me = currentStudent();

    document.getElementById('avatar').textContent = initials(me.fullName);
    document.getElementById('reg-display').textContent = me.regNo;
    document.getElementById('fullName').value = me.fullName;
    document.getElementById('email').value = me.email;
    document.getElementById('phone').value = me.phone;
    document.getElementById('gender').value = me.gender;
    document.getElementById('faculty').value = me.faculty;
    document.getElementById('department').value = me.department;
    document.getElementById('course').value = me.course;
    document.getElementById('year').value = String(me.year);

    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      me.fullName = document.getElementById('fullName').value.trim();
      me.email = document.getElementById('email').value.trim();
      me.phone = document.getElementById('phone').value.trim();
      me.gender = document.getElementById('gender').value;
      me.faculty = document.getElementById('faculty').value.trim();
      me.department = document.getElementById('department').value.trim();
      me.course = document.getElementById('course').value.trim();
      me.year = Number(document.getElementById('year').value);
      DB.students.save(me);
      DB.logAudit('PROFILE_UPDATE', `Student ${me.regNo} updated their profile.`);
      toast('Profile updated.', 'success');
    });

    document.getElementById('password-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const current = document.getElementById('current-pw').value;
      const next = document.getElementById('new-pw').value;
      const errEl = document.getElementById('pw-error');
      if (current !== me.password){
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      me.password = next;
      DB.students.save(me);
      DB.logAudit('PASSWORD_CHANGE', `Student ${me.regNo} changed their password.`);
      document.getElementById('password-form').reset();
      toast('Password updated.', 'success');
    });
  }
</script>
</body>
</html>
